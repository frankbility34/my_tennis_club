{% extends "base.html" %}

{% block title %}Contact Us{% endblock %}

{% block content %}

<div class="container py-5">

    <h1>Contact Us</h1>

    <p>Have a question? Send us a message.</p>

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label for="name" class="form-label">Name</label>

            <input
                type="text"
                name="name"
                id="name"
                class="form-control"
                required
            >
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email</label>

            <input
                type="email"
                name="email"
                id="email"
                class="form-control"
                required
            >
        </div>

        <div class="mb-3">
            <label for="message" class="form-label">Message</label>

            <textarea
                name="message"
                id="message"
                class="form-control"
                rows="5"
                required
            ></textarea>
        </div>

        <button type="submit" class="btn btn-primary">
            Send Message
        </button>

    </form>

</div>

{% endblock %}
