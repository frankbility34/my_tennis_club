{% extends "base.html" %}

{% block title %}
    Edit Profile
{% endblock %}


{% block content %}

<div class="container mt-5 mb-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h2 class="mb-4">
                        Edit Profile
                    </h2>


                    <form
                        method="POST"
                    >

                        {% csrf_token %}


                        <!-- FIRST NAME -->

                        <div class="mb-3">

                            <label
                                for="first_name"
                                class="form-label"
                            >
                                First Name
                            </label>

                            <input
                                type="text"
                                id="first_name"
                                name="first_name"
                                class="form-control"
                                value="{{ user.first_name }}"
                            >

                        </div>


                        <!-- LAST NAME -->

                        <div class="mb-3">

                            <label
                                for="last_name"
                                class="form-label"
                            >
                                Last Name
                            </label>

                            <input
                                type="text"
                                id="last_name"
                                name="last_name"
                                class="form-control"
                                value="{{ user.last_name }}"
                            >

                        </div>


                        <!-- EMAIL -->

                        <div class="mb-3">

                            <label
                                for="email"
                                class="form-label"
                            >
                                Email Address
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                class="form-control"
                                value="{{ user.email }}"
                            >

                        </div>


                        <!-- USERNAME -->

                        <div class="mb-3">

                            <label
                                class="form-label"
                            >
                                Username
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                value="{{ user.username }}"
                                disabled
                            >

                            <small class="text-muted">
                                Username cannot be changed here.
                            </small>

                        </div>


                        <!-- BUTTONS -->

                        <div class="mt-4">

                            <button
                                type="submit"
                                class="btn btn-primary"
                            >
                                Save Changes
                            </button>


                            <a
                                href="{% url 'profile' %}"
                                class="btn btn-secondary"
                            >
                                Cancel
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
