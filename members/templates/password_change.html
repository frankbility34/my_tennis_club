{% extends "base.html" %}

{% block title %}
    Change Password
{% endblock %}


{% block content %}

<div class="container mt-5 mb-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h2 class="mb-4">
                        Change Password
                    </h2>


                    <form method="POST">

                        {% csrf_token %}

                        {{ form.as_p }}


                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Change Password
                        </button>


                        <a
                            href="{% url 'profile' %}"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
