{% extends "base.html" %}

{% block title %}
Edit Tag | MSAN News Blog
{% endblock %}

{% block content %}

<div class="container mt-5 mb-5">


<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow">

            <div class="card-header">
                <h3 class="mb-0">
                    Edit Tag
                </h3>
            </div>

            <div class="card-body">

                <form method="POST">

                    {% csrf_token %}

                    <div class="form-group">

                        <label for="tg_name">
                            Tag Name
                        </label>

                        <input
                            type="text"
                            name="tg_name"
                            id="tg_name"
                            class="form-control"
                            value="{{ tag.tg_name }}"
                            required
                        >

                    </div>

                    <div class="mt-4">

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Save Changes
                        </button>

                        <a
                            href="{% url 'tags_management' %}"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>


</div>

{% endblock %}
