{% extends "base.html" %}

{% block title %}
Reset Password
{% endblock %}

{% block content %}

<div class="container mt-5">


<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow-sm">

            <div class="card-body">

                <h2 class="mb-3">
                    Reset Your Password
                </h2>

                <p class="text-muted">
                    Enter your email address and we will
                    send you a link to reset your password.
                </p>

                <form method="POST">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button
                        type="submit"
                        class="btn btn-primary w-100"
                    >
                        Send Reset Link
                    </button>

                </form>

                <div class="mt-3">

                    <a href="{% url 'login' %}">
                        Back to Login
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>


</div>

{% endblock %}
