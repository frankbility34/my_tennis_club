{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="container mt-5 mb-5">


<div class="row justify-content-center">

    <div class="col-md-5 col-lg-4">

        <div class="card shadow">

            <div class="card-body p-4">

                <div class="text-center mb-4">

                    <h2>
                        Login
                    </h2>

                    <p class="text-muted">
                        Welcome back to our blog.
                    </p>

                </div>


                {% if messages %}

                    {% for message in messages %}

                        <div class="alert alert-{{ message.tags }}">

                            {{ message }}

                        </div>

                    {% endfor %}

                {% endif %}


                <form
                    method="POST"
                    action="{% url 'login' %}"
                >

                    {% csrf_token %}


                    <!-- USERNAME -->

                    <div class="form-group mb-3">

                        <label for="username">
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            class="form-control"
                            placeholder="Enter your username"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->

                    <div class="form-group mb-4">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary btn-block"
                    >

                        Login

                    </button>

                </form>

                <div class="mt-3">

                    <a href="{% url 'password_reset' %}">
                        Forgot Password?
                    </a>

                </div>


                <div class="text-center mt-4">

                    <p>

                        Don't have an account?

                        <a href="{% url 'register' %}">
                            Create Account
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</div>


</div>

{% endblock %}
