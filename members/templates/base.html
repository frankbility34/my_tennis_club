{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    {% block title %}
        MSAN News Blog
    {% endblock %}
</title>


<!-- ========================================================= -->
<!-- SEO META INFORMATION -->
<!-- ========================================================= -->

<meta
    name="description"
    content="MSAN News Blog — latest news, stories, insights, and articles."
>

<meta
    name="keywords"
    content="MSAN News Blog, news, Nigeria, articles, stories, latest news"
>

<meta
    name="author"
    content="MSAN News Blog"
>


<!-- ========================================================= -->
<!-- GOOGLE FONTS -->
<!-- ========================================================= -->

<link
    href="https://fonts.googleapis.com/css?family=Open+Sans:400,600,700&display=swap"
    rel="stylesheet"
>


<!-- ========================================================= -->
<!-- BOOTSTRAP -->
<!-- ========================================================= -->

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
>


<!-- ========================================================= -->
<!-- FONT AWESOME -->
<!-- ========================================================= -->

<link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css"
    rel="stylesheet"
>


<!-- ========================================================= -->
<!-- SLICK SLIDER -->
<!-- ========================================================= -->

<link
    href="{% static 'lib/slick/slick.css' %}"
    rel="stylesheet"
>

<link
    href="{% static 'lib/slick/slick-theme.css' %}"
    rel="stylesheet"
>


<!-- ========================================================= -->
<!-- MAIN STYLESHEET -->
<!-- ========================================================= -->

<link
    href="{% static 'css/style.css' %}"
    rel="stylesheet"
>


</head>

<body>


<!-- ========================================================= -->
<!-- NAVIGATION -->
<!-- ========================================================= -->

{% include 'navLinks.html' %}


<!-- ========================================================= -->
<!-- DJANGO MESSAGES -->
<!-- ========================================================= -->

{% if messages %}

    <div class="container mt-3">

        {% for message in messages %}

            <div
                class="alert alert-{{ message.tags }} alert-dismissible fade show"
                role="alert"
            >

                {{ message }}

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="alert"
                    aria-label="Close"
                ></button>

            </div>

        {% endfor %}

    </div>

{% endif %}


<!-- ========================================================= -->
<!-- PAGE WRAPPER -->
<!-- ========================================================= -->

<div class="page-wrapper">


    <!-- ===================================================== -->
    <!-- MAIN CONTENT -->
    <!-- ===================================================== -->

    <main class="main-content">

        {% block content %}
        {% endblock %}

    </main>


    <!-- ===================================================== -->
    <!-- FOOTER -->
    <!-- ===================================================== -->

    {% include 'navFooter.html' %}


</div>


<!-- ========================================================= -->
<!-- JAVASCRIPT LIBRARIES -->
<!-- ========================================================= -->

<script
    src="https://code.jquery.com/jquery-3.4.1.min.js"
></script>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>

<script
    src="{% static 'lib/easing/easing.min.js' %}"
></script>

<script
    src="{% static 'lib/slick/slick.min.js' %}"
></script>


<!-- ========================================================= -->
<!-- MAIN JAVASCRIPT -->
<!-- ========================================================= -->

<script
    src="{% static 'js/main.js' %}"
></script>


</body>

</html>
